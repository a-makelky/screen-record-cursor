name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
    branches:
      - main
    paths:
      - ".github/alpha-release-version"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: swift test --parallel
      - run: swift build -c release
      - name: Stage executable
        run: |
          mkdir -p output
          cp "$(swift build -c release --show-bin-path)/ScreenRecordCursor" \
            "output/ScreenRecordCursor-${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.architecture }}
          path: output/ScreenRecordCursor-${{ matrix.architecture }}

  package:
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_version="$GITHUB_REF_NAME"
          else
            release_version="$(tr -d '[:space:]' < .github/alpha-release-version)"
          fi
          if [[ ! "$release_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: executable-*
          path: executables
          merge-multiple: true
      - name: Create universal app
        env:
          APP_BUILD: ${{ github.run_number }}
        run: |
          APP_VERSION="$RELEASE_VERSION"
          APP_VERSION="${APP_VERSION#v}"
          APP_VERSION="${APP_VERSION%%-*}"
          mkdir -p universal release
          lipo -create \
            executables/ScreenRecordCursor-arm64 \
            executables/ScreenRecordCursor-x86_64 \
            -output universal/ScreenRecordCursor
          chmod +x universal/ScreenRecordCursor
          SCREEN_RECORD_CURSOR_BINARY="$PWD/universal/ScreenRecordCursor" \
            OUTPUT_DIR="$PWD/release" \
            APP_VERSION="$APP_VERSION" \
            APP_BUILD="$APP_BUILD" \
            ./Scripts/build-app.sh
          EXPECTED_APP_VERSION="$APP_VERSION" \
            EXPECTED_APP_BUILD="$APP_BUILD" \
            ./Scripts/verify-app.sh "$PWD/release/Screen Record Cursor.app"
          architectures="$(lipo -archs "$PWD/release/Screen Record Cursor.app/Contents/MacOS/ScreenRecordCursor")"
          test "$architectures" = "x86_64 arm64" || test "$architectures" = "arm64 x86_64"
      - name: Package release
        working-directory: release
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "Screen Record Cursor.app" \
            "Screen-Record-Cursor-${RELEASE_VERSION}.zip"
          shasum -a 256 "Screen-Record-Cursor-${RELEASE_VERSION}.zip" \
            > "Screen-Record-Cursor-${RELEASE_VERSION}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          release_title="Screen Record Cursor $RELEASE_VERSION"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
            release_title="$release_title (Alpha)"
          fi

          gh release create "$RELEASE_VERSION" \
            release/Screen-Record-Cursor-"$RELEASE_VERSION".zip \
            release/Screen-Record-Cursor-"$RELEASE_VERSION".sha256 \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$release_title" \
            "${release_flags[@]}"
