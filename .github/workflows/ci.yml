name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: ./Scripts/validate-static.sh

  native:
    needs:
      - static
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --parallel
      - name: Build app
        run: ./Scripts/build-app.sh
      - name: Verify app
        run: ./Scripts/verify-app.sh
      - name: Package app artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ".build/app/Screen Recording Cursor.app" \
            "ScreenRecordCursor-${{ matrix.runner }}.zip"
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecordCursor-${{ matrix.runner }}
          path: ScreenRecordCursor-${{ matrix.runner }}.zip

  universal-preview:
    needs:
      - native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download native builds
        uses: actions/download-artifact@v4
        with:
          pattern: ScreenRecordCursor-macos-15*
          path: packages
          merge-multiple: true
      - name: Create universal preview app
        run: |
          mkdir -p arm64 intel universal
          ditto -x -k \
            "packages/ScreenRecordCursor-macos-15.zip" \
            arm64
          ditto -x -k \
            "packages/ScreenRecordCursor-macos-15-intel.zip" \
            intel
          cp -R \
            "arm64/Screen Recording Cursor.app" \
            "universal/Screen Recording Cursor.app"
          lipo -create \
            "arm64/Screen Recording Cursor.app/Contents/MacOS/ScreenRecordCursor" \
            "intel/Screen Recording Cursor.app/Contents/MacOS/ScreenRecordCursor" \
            -output \
            "universal/Screen Recording Cursor.app/Contents/MacOS/ScreenRecordCursor"
          chmod +x \
            "universal/Screen Recording Cursor.app/Contents/MacOS/ScreenRecordCursor"
          codesign \
            --force \
            --sign - \
            --entitlements Resources/ScreenRecordCursor.entitlements \
            "universal/Screen Recording Cursor.app"
          architectures="$(
            lipo -archs \
              "universal/Screen Recording Cursor.app/Contents/MacOS/ScreenRecordCursor"
          )"
          test "$architectures" = "x86_64 arm64" || \
            test "$architectures" = "arm64 x86_64"
          ./Scripts/verify-app.sh \
            "$PWD/universal/Screen Recording Cursor.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "universal/Screen Recording Cursor.app" \
            "Screen-Recording-Cursor-Store-Overlay-Preview.zip"
      - name: Upload universal preview
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecordingCursor-universal-preview
          path: Screen-Recording-Cursor-Store-Overlay-Preview.zip
          retention-days: 14
